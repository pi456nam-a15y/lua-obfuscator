<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Roblox Deobfuscator & Code Analyzer</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --text-color: #c9d1d9;
            --text-dim: #8b949e;
            --success-color: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .editor-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
        }

        textarea {
            width: 100%;
            height: 220px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #7ee787;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            font-size: 0.88rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .action-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 5px 0;
        }

        .btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-secondary:hover {
            background-color: #484f58;
        }

        .analysis-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.85rem;
        }

        .analysis-card h3 {
            color: var(--accent-color);
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .log-list {
            list-style-type: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: var(--text-dim);
        }

        .log-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-color);
        }

        .controls-inline {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Lua Roblox Deobfuscator & Analyzer</h1>
        <p>เครื่องมือวิเคราะห์ ถอดรหัส String และจัดโครงสร้างโค้ด Lua/Luau หลายชั้น</p>
    </header>

    <!-- ส่วนที่ 1: แถบสำหรับวางโค้ดที่เข้ารหัส -->
    <div class="editor-section">
        <div class="section-label">
            <span>ส่วนที่ 1: โค้ดที่เข้ารหัส (Obfuscated Lua Code)</span>
            <button class="btn btn-secondary" onclick="clearInput()">ล้างข้อมูล</button>
        </div>
        <textarea id="inputCode" placeholder="วางโค้ด Lua ที่เข้ารหัส (Obfuscated) หรือถูกบีบอัดที่นี่..."></textarea>
    </div>

    <!-- ปุ่มตรงกลางสำหรับถอดรหัส -->
    <div class="action-bar">
        <button class="btn" onclick="processDeobfuscation()">
            ⚡ วิเคราะห์และถอดรหัสโค้ด
        </button>
    </div>

    <!-- รายงานผลการวิเคราะห์ AI / Engine -->
    <div class="analysis-card" id="analysisCard" style="display: none;">
        <h3>🔍 รายงานการตรวจจับและวิเคราะห์โครงสร้าง (Analysis Report)</h3>
        <ul class="log-list" id="analysisLogs"></ul>
    </div>

    <!-- ส่วนที่ 2: ช่องแสดงโค้ดที่ถอดรหัสแล้ว -->
    <div class="editor-section">
        <div class="section-label">
            <span>ส่วนที่ 2: โค้ดต้นฉบับที่ถอดรหัสแล้ว (Deobfuscated Result)</span>
            <div class="controls-inline">
                <button class="btn btn-secondary" onclick="copyOutput()">📋 คัดลอกโค้ด</button>
                <button class="btn btn-secondary" onclick="downloadOutput()">💾 ดาวน์โหลดไฟล์ (.lua)</button>
            </div>
        </div>
        <textarea id="outputCode" readonly placeholder="ผลลัพธ์โค้ดที่ถอดรหัสแล้วจะแสดงที่นี่..."></textarea>
    </div>
</div>

<script>
    // --- Engine หลักในการถอดรหัสและทำความสะอาดโค้ด Lua ---
    function processDeobfuscation() {
        const input = document.getElementById("inputCode").value;
        const outputElement = document.getElementById("outputCode");
        const logsElement = document.getElementById("analysisLogs");
        const cardElement = document.getElementById("analysisCard");

        if (!input.trim()) {
            alert("กรุณาวางโค้ดที่ต้องการถอดรหัสในช่องด้านบน");
            return;
        }

        logsElement.innerHTML = "";
        cardElement.style.display = "block";

        let logs = [];
        let code = input;

        // 1. ตรวจสอบร่องรอยของการเข้ารหัสหลายชั้น (Multi-layer / VM Pattern Detection)
        logs.push(detectObfuscatorSignatures(code));

        // 2. ถอดรหัส Hex Escape Characters (\xXX)
        const hexResult = decodeHexEscapes(code);
        if (hexResult.count > 0) {
            code = hexResult.code;
            logs.push(`[Layer 1] แปลงโค้ด Hex Escape Sequences (\xXX) จำนวน ${hexResult.count} จุด`);
        }

        // 3. ถอดรหัส Decimal/Numeric Escapes (\115\116\114...)
        const decResult = decodeDecimalEscapes(code);
        if (decResult.count > 0) {
            code = decResult.code;
            logs.push(`[Layer 2] แปลงรหัสตัวเลข ASCII Escapes (\\ddd) จำนวน ${decResult.count} จุด`);
        }

        // 4. ถอดรหัส string.char(...) ที่ถููกบีบอัดเป็น Array
        const charResult = decodeStringChar(code);
        if (charResult.count > 0) {
            code = charResult.code;
            logs.push(`[Layer 3] รวมตาราง string.char(...) เป็นข้อความปกติ จำนวน ${charResult.count} ชุด`);
        }

        // 5. คำนวณและลดทอนนิพจน์คณิตศาสตร์แบบย่อ (Constant Folding)
        const mathResult = simplifyMathExpressions(code);
        if (mathResult.count > 0) {
            code = mathResult.code;
            logs.push(`[Layer 4] คำนวณสมการตัวเลขที่ถูกซ่อน (Constant Folding) จำนวน ${mathResult.count} จุด`);
        }

        // 6. ถอดซองล้อมแบบ loadstring() หรือ unpack wrappers
        const wrapperResult = unwrapLoadstring(code);
        if (wrapperResult.unwrapped) {
            code = wrapperResult.code;
            logs.push(`[Layer 5] ตรวจพบและแกะชั้นล้อม loadstring / execution wrapper ออกแล้ว`);
        }

        // 7. จัดรูปแบบโค้ดให้ อ่านง่าย (Beautifier / Indenter)
        code = beautifyLua(code);
        logs.push(`[Final Stage] จัดระเบียบการย่อหน้าและโครงสร้างโค้ดเรียบร้อยแล้ว`);

        // แสดงผลลัพธ์
        outputElement.value = code;

        // แสดงบันทึกการวิเคราะห์
        logs.forEach(log => {
            const li = document.createElement("li");
            li.className = "log-item";
            li.innerHTML = `<span class="status-dot"></span> ${log}`;
            logsElement.appendChild(li);
        });
    }

    // --- ฟังก์ชันย่อยสำหรับประมวลผล ---

    function detectObfuscatorSignatures(code) {
        let signatures = [];
        if (code.includes("Luraph") || code.includes("LPH_")) signatures.push("Luraph Obfuscator");
        if (code.includes("IronBrew") || code.includes("IB_")) signatures.push("IronBrew VM");
        if (code.includes("PSU") || code.includes("PSUObfuscator")) signatures.push("PSU Obfuscator");
        if (code.includes("MoonSec")) signatures.push("MoonSec VM");
        if (code.includes("getfenv") && code.includes("string.byte")) signatures.push("Custom Virtual Machine (VM Wrap)");

        if (signatures.length > 0) {
            return `[AI Inspector] ตรวจพบเอกลักษณ์การเข้ารหัสประเภท: <strong>${signatures.join(", ")}</strong>`;
        }
        return `[AI Inspector] ไม่พบเอกลักษณ์ VM สำเร็จรูปที่รู้จัก - ทำงานในโหมด Generic Static Analysis`;
    }

    function decodeHexEscapes(code) {
        let count = 0;
        const decoded = code.replace(/\\x([0-9a-fA-F]{2})/g, (match, hex) => {
            count++;
            return String.fromCharCode(parseInt(hex, 16));
        });
        return { code: decoded, count };
    }

    function decodeDecimalEscapes(code) {
        let count = 0;
        const decoded = code.replace(/\\([0-9]{1,3})/g, (match, dec) => { const charCode = parseInt(dec, 10); if (charCode >= 32 && charCode <= 126) { count++; return String.fromCharCode(charCode); } return match; }); return { code: decoded, count }; }      function decodeStringChar(code) { let count = 0; const decoded = code.replace(/string\.char\(([\d\s,]+)\)/g, (match, args) => { try { const nums = args.split(',').map(n => parseInt(n.trim(), 10)); if (nums.every(n => !isNaN(n))) { count++; return '"' + String.fromCharCode(...nums) + '"'; } } catch (e) {} return match; }); return { code: decoded, count }; }      function simplifyMathExpressions(code) { let count = 0; // ปรับการคำนวณบวก/ลบ/คูณ ของตัวเลขโดดเบื้องต้น const decoded = code.replace(/\b(\d+)\s*([\+\-\*])\s*(\d+)\b/g, (match, n1, op, n2) => { const a = parseInt(n1, 10); const b = parseInt(n2, 10); count++; if (op === '+') return (a + b).toString(); if (op === '-') return (a - b).toString(); if (op === '*') return (a * b).toString(); return match; }); return { code: decoded, count }; }      function unwrapLoadstring(code) { let unwrapped = false; let cleaned = code; const loadstringRegex = /loadstring\s*\(\s*["'](.*)["']\s*\)\s*\(\)/s;
        const match = cleaned.match(loadstringRegex);
        if (match && match[1]) {
            cleaned = match[1];
            unwrapped = true;
        }
        return { code: cleaned, unwrapped };
    }

    function beautifyLua(code) {
        let indent = 0;
        const lines = code.split('\n');
        const formatted = [];

        for (let line of lines) {
            let trimmed = line.trim();
            if (!trimmed) continue;

            if (trimmed.startsWith('end') || trimmed.startsWith('until') || trimmed.startsWith('else') || trimmed.startsWith('elseif')) {
                indent = Math.max(0, indent - 1);
            }

            formatted.push('    '.repeat(indent) + trimmed);

            if (
                (trimmed.startsWith('function') || 
                 trimmed.startsWith('if') || 
                 trimmed.startsWith('for') || 
                 trimmed.startsWith('while') || 
                 trimmed.endsWith('then') || 
                 trimmed.endsWith('do')) && 
                !trimmed.endsWith('end')
            ) {
                indent++;
            }
        }
        return formatted.join('\n');
    }

    // --- Helper Functions สำหรับ UI ---

    function clearInput() {
        document.getElementById("inputCode").value = "";
        document.getElementById("outputCode").value = "";
        document.getElementById("analysisCard").style.display = "none";
    }

    function copyOutput() {
        const output = document.getElementById("outputCode");
        if (!output.value) {
            alert("ไม่มีโค้ดสำหรับคัดลอก");
            return;
        }
        output.select();
        document.execCommand("copy");
        alert("คัดลอกโค้ดลง Clipboard เรียบร้อยแล้ว!");
    }

    function downloadOutput() {
        const code = document.getElementById("outputCode").value;
        if (!code) {
            alert("ไม่มีโค้ดสำหรับดาวน์โหลด");
            return;
        }
        const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "deobfuscated_script.lua";
        a.click();
        URL.revokeObjectURL(a.href);
    }
</script>

</body>
</html>
