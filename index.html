<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua & Luau Advanced Deobfuscator Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #0b0d10;
            color: #e2e8f0;
        }
        code, textarea, pre, #log-output {
            font-family: 'Fira Code', monospace;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #12151a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #272d37;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3f4756;
        }
        .glow-red {
            box-shadow: 0 0 18px rgba(220, 38, 38, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

    <!-- Header Navigation -->
    <header class="border-b border-gray-800 bg-[#111419] px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-red-600/30">
                🔓
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-white flex items-center gap-2">
                    Lua Deobfuscator Pro <span class="text-xs bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded-full">v2.5 Engine</span>
                </h1>
                <p class="text-xs text-gray-400">เครื่องมือถอดรหัส Lua/Luau ขั้นสูง (Multi-Pass Engine, String Table, Escapes, Clean Syntax)</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="clearAll()" class="text-xs bg-gray-800 hover:bg-red-950 hover:text-red-300 text-gray-300 font-medium px-3 py-2 rounded-lg border border-gray-700 transition">
                <i class="fa-solid fa-trash-can mr-1.5"></i> ล้างข้อมูล
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col space-y-5">

        <!-- 1. Input Section -->
        <section class="flex flex-col flex-1 bg-[#111419] border border-gray-800/80 rounded-xl p-4 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <label for="input-code" class="text-sm font-semibold text-gray-300 flex items-center">
                    <i class="fa-solid fa-file-code text-red-500 mr-2"></i> โค้ดที่เข้ารหัสไว้ (Obfuscated Code)
                </label>
                <span id="input-stats" class="text-xs text-gray-500">0 ตัวอักษร</span>
            </div>
            <textarea id="input-code" placeholder="-- วางโค้ด Lua / Luau ที่เข้ารหัสแล้วตรงนี้..." 
                class="w-full h-64 bg-[#08090c] border border-gray-800 rounded-lg p-3.5 text-sm text-green-400 focus:outline-none focus:border-red-500 custom-scrollbar resize-y transition"></textarea>
        </section>

        <!-- 2. Controls & Options -->
        <section class="bg-[#111419] border border-gray-800/80 rounded-xl p-4 shadow-xl flex flex-col lg:flex-row items-center justify-between gap-4">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs text-gray-300 w-full lg:w-auto">
                <label class="flex items-center space-x-2 cursor-pointer hover:text-white bg-[#181c23] p-2 rounded-lg border border-gray-800">
                    <input type="checkbox" id="opt-recursive" checked class="rounded border-gray-700 bg-gray-900 text-red-600 focus:ring-red-500">
                    <span class="font-semibold text-red-400">Multi-Pass Unpack</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer hover:text-white bg-[#181c23] p-2 rounded-lg border border-gray-800">
                    <input type="checkbox" id="opt-tables" checked class="rounded border-gray-700 bg-gray-900 text-red-600 focus:ring-red-500">
                    <span>String Table Resolver</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer hover:text-white bg-[#181c23] p-2 rounded-lg border border-gray-800">
                    <input type="checkbox" id="opt-escapes" checked class="rounded border-gray-700 bg-gray-900 text-red-600 focus:ring-red-500">
                    <span>Decode Escapes / Hex</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer hover:text-white bg-[#181c23] p-2 rounded-lg border border-gray-800">
                    <input type="checkbox" id="opt-clean" checked class="rounded border-gray-700 bg-gray-900 text-red-600 focus:ring-red-500">
                    <span>Clean Syntax & Method</span>
                </label>
            </div>

            <div class="w-full lg:w-auto flex items-center justify-end space-x-3">
                <button onclick="runDeobfuscator()" 
                    class="w-full lg:w-auto px-8 py-3 bg-red-600 hover:bg-red-500 text-white font-bold text-base rounded-xl shadow-lg glow-red transition transform active:scale-95 flex items-center justify-center">
                    <i class="fa-solid fa-bolt mr-2"></i> เริ่มการถอดรหัสขั้นสูง
                </button>
            </div>
        </section>

        <!-- 3. Deobfuscation Log Console -->
        <section class="bg-[#111419] border border-gray-800/80 rounded-xl p-3 shadow-xl">
            <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-semibold text-gray-400 flex items-center">
                    <i class="fa-solid fa-terminal text-yellow-500 mr-2"></i> Deobfuscator Execution Logs
                </span>
                <span id="log-count" class="text-[10px] text-gray-500">0 รายการ</span>
            </div>
            <div id="log-output" class="w-full h-24 bg-[#08090c] border border-gray-800/60 rounded-lg p-2.5 text-xs text-gray-400 overflow-y-auto custom-scrollbar leading-relaxed">
                <span class="text-gray-600">-- รอดำเนินการถอดรหัส...</span>
            </div>
        </section>

        <!-- 4. Output Section -->
        <section class="flex flex-col flex-1 bg-[#111419] border border-gray-800/80 rounded-xl p-4 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <label for="output-code" class="text-sm font-semibold text-gray-300 flex items-center">
                    <i class="fa-solid fa-code text-green-500 mr-2"></i> ผลลัพธ์โค้ดที่ถอดรหัสแล้ว (Deobfuscated Output)
                </label>
                <div class="flex items-center space-x-2">
                    <button onclick="copyOutput()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg border border-gray-700 transition">
                        <i class="fa-regular fa-copy mr-1"></i> คัดลอก
                    </button>
                    <button onclick="downloadOutput()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg border border-gray-700 transition">
                        <i class="fa-solid fa-download mr-1"></i> ดาวน์โหลด .lua
                    </button>
                </div>
            </div>
            <textarea id="output-code" readonly placeholder="-- ผลลัพธ์จะแสดงขึ้นที่นี่..." 
                class="w-full h-80 bg-[#08090c] border border-gray-800 rounded-lg p-3.5 text-sm text-blue-300 focus:outline-none custom-scrollbar resize-y"></textarea>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 border border-gray-700 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center space-x-2 transition opacity-0 pointer-events-none z-50">
        <i id="toast-icon" class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toast-message">แจ้งเตือน</span>
    </div>

    <script>
        document.getElementById('input-code').addEventListener('input', function() {
            document.getElementById('input-stats').innerText = `${this.value.length.toLocaleString()} ตัวอักษร`;
        });

        // =========================================================================
        // ADVANCED LUA DEOBFUSCATOR ENGINE
        // =========================================================================
        class LuaDeobfuscatorEngine {
            constructor(options) {
                this.options = options;
                this.logs = [];
            }

            log(msg, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                this.logs.push(`[${timestamp}] [${type.toUpperCase()}] ${msg}`);
            }

            // Main Pipeline
            process(inputCode) {
                let code = inputCode;
                let previousCode = "";
                let passCount = 0;
                const maxPasses = this.options.recursive ? 5 : 1;

                this.log("เริ่มต้นกระบวนการถอดรหัส...");

                while (passCount < maxPasses && code !== previousCode) {
                    previousCode = code;
                    passCount++;
                    this.log(`--- กำลังประมวลผล Pass #${passCount} ---`);

                    // 1. Unpack loadstring & string.char payloads
                    if (this.options.recursive) {
                        code = this.unpackLoadstringPayloads(code);
                    }

                    // 2. Decode String.char & Byte/Hex Escapes
                    if (this.options.escapes) {
                        code = this.decodeStringChar(code);
                        code = this.decodeEscapes(code);
                    }

                    // 3. String Table & Array Resolver
                    if (this.options.tables) {
                        code = this.resolveStringTables(code);
                        code = this.resolveStringConcatenation(code);
                    }

                    // 4. BolongBot & Generic XOR Engine
                    code = this.deobfuscateXorEngine(code);

                    // 5. Clean Properties & Environment Syntax
                    if (this.options.clean) {
                        code = this.cleanSyntaxAndMethods(code);
                    }
                }

                // Final Formatting
                this.log("จัดรูปแบบโค้ด (Auto Formatting)...");
                code = this.beautifyLua(code);

                this.log("ถอดรหัสเสร็จสมบูรณ์!", "success");
                return { code, logs: this.logs };
            }

            // Unpack loadstring(string.char(...))() or loadstring("...")
            unpackLoadstringPayloads(code) {
                let matches = 0;
                // Pattern 1: loadstring(string.char(...))()
                code = code.replace(/loadstring\s*\(\s*string\.char\s*\(([^)]+)\)\s*\)\s*\(\s*\)/gi, (m, bytesStr) => {
                    try {
                        const bytes = bytesStr.split(',').map(b => parseInt(b.trim(), 10));
                        const decoded = String.fromCharCode(...bytes);
                        matches++;
                        return decoded;
                    } catch(e) { return m; }
                });

                // Pattern 2: loadstring("decoded_string")()
                code = code.replace(/loadstring\s*\(\s*"((?:[^"\\]\vert{}\\.)*)"\s*\)\s*\(\s*\)/gi, (m, strContent) => {
                    matches++;
                    return this.unescapeLuaString(strContent);
                });

                if (matches > 0) this.log(`Unpacked ${matches} payload(s) จาก loadstring(...)`);
                return code;
            }

            // Resolve string.char(...) calls
            decodeStringChar(code) {
                let count = 0;
                const result = code.replace(/string\.char\s*\(\s*([\d\s,]+)\s*\)/gi, (match, byteGroup) => {
                    try {
                        const bytes = byteGroup.split(',').map(b => parseInt(b.trim(), 10));
                        if (bytes.some(b => isNaN(b))) return match;
                        count++;
                        const str = String.fromCharCode(...bytes);
                        return JSON.stringify(str);
                    } catch (e) {
                        return match;
                    }
                });
                if (count > 0) this.log(`ถอดรหัส string.char() ทั้งหมด ${count} จุด`);
                return result;
            }

            // Decode \xXX, \ddd, and Unicode Escapes
            decodeEscapes(code) {
                let count = 0;
                // Hex Escapes (\x41)
                code = code.replace(/\\x([0-9a-fA-F]{2})/g, (_, hex) => {
                    count++;
                    return String.fromCharCode(parseInt(hex, 16));
                });

                // Decimal Escapes (\104)
                code = code.replace(/\\([0-9]{1,3})/g, (match, dec) => {
                    const num = parseInt(dec, 10);
                    if (num >= 32 && num <= 126) {
                        count++;
                        const char = String.fromCharCode(num);
                        return (char === '"' || char === '\\') ? `\\${char}` : char;
                    }
                    return match;
                });

                if (count > 0) this.log(`แปลง Escaped Characters (\xXX / \ddd) จำนวน ${count} ตัว`);
                return code;
            }

            // Unpack String Tables: local T = { "str1", "str2" } -> replace T[1] with "str1"
            resolveStringTables(code) {
                let replaced = 0;
                // Find table definitions: local Var = { "a", "b", "c" }
                const tableRegex = /local\s+([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*\{\s*("(?:[^"\\]|\\.)*"(?:\s*,\s*"(?:[^"\\]|\\.)*")*)\s*\}/g;
                let match;

                while ((match = tableRegex.exec(code)) !== null) {
                    const tableName = match[1];
                    const rawItems = match[2];

                    // Extract items
                    const itemRegex = /"((?:[^"\\]|\\.)*)"/g;
                    let itemMatch;
                    let index = 1;
                    const map = {};

                    while ((itemMatch = itemRegex.exec(rawItems)) !== null) {
                        map[index] = itemMatch[1];
                        index++;
                    }

                    // Replace T[1] or T[0x1]
                    const usageRegex = new RegExp(`\\b${tableName}\\s*\\[\\s*(0x[0-9a-fA-F]+|\\d+)\\s*\\]`, 'g');
                    code = code.replace(usageRegex, (m, idxStr) => {
                        const idx = idxStr.startsWith('0x') ? parseInt(idxStr, 16) : parseInt(idxStr, 10);
                        if (map[idx] !== undefined) {
                            replaced++;
                            return JSON.stringify(map[idx]);
                        }
                        return m;
                    });
                }

                if (replaced > 0) this.log(`แกะค่าจาก String Table อ้างอิงสำเร็จ ${replaced} จุด`);
                return code;
            }

            // Concatenate Strings: "Hello " .. "World" -> "Hello World"
            resolveStringConcatenation(code) {
                let count = 0;
                const concatRegex = /"((?:[^"\\]|\\.)*)"\s*\.\.\s*"((?:[^"\\]|\\.)*)"/g;
                while (concatRegex.test(code)) {
                    code = code.replace(concatRegex, (_, s1, s2) => {
                        count++;
                        return JSON.stringify(s1 + s2);
                    });
                }
                if (count > 0) this.log(`เชื่อมต่อสตริง (Concatenation) จำนวน ${count} จุด`);
                return code;
            }

            // Deobfuscate BolongBot & Dynamic XOR Tables
            deobfuscateXorEngine(code) {
                const tableMatch = code.match(/local\s+([a-zA-Z0-9_]+)\s*=\s*\{\s*("(?:[^"\\]|\\.)*"(?:\s*,\s*"(?:[^"\\]|\\.)*")*)\s*\}/s);
                if (!tableMatch) return code;

                const arrayVarName = tableMatch[1];
                const rawElements = tableMatch[2];

                const resultTableMatch = code.match(/([a-zA-Z0-9_]+)\s*\[\s*[a-zA-Z0-9_]+\s*\]\s*=\s*table\.concat/);
                const targetTableName = resultTableMatch ? resultTableMatch[1] : null;

                let initKey = 97, stepKey = 8;
                const initMatch = code.match(/local\s+[a-zA-Z0-9_]+\s*=\s*(\d+)/);
                if (initMatch) initKey = parseInt(initMatch[1], 10);

                const stringRegex = /"((?:[^"\\]|\\.)*)"/g;
                let match;
                let strings = [];
                while ((match = stringRegex.exec(rawElements)) !== null) {
                    strings.push(match[1]);
                }

                let decodedStrings = {};
                for (let idx = 0; idx < strings.length; idx++) {
                    let luaIdx = idx + 1;
                    let xorKey = (initKey + luaIdx * stepKey) % 256;
                    let rawBytes = this.parseLuaBytes(strings[idx]);
                    let decrypted = rawBytes.map(b => String.fromCharCode(b ^ xorKey)).join('');
                    decodedStrings[luaIdx] = decrypted;
                }

                if (targetTableName) {
                    let count = 0;
                    const replaceRegex = new RegExp(targetTableName + '\\s*\\[\\s*(\\d+)\\s*\\]', 'g');
                    code = code.replace(replaceRegex, (m, indexStr) => {
                        let index = parseInt(indexStr, 10);
                        if (decodedStrings[index] !== undefined) {
                            count++;
                            return JSON.stringify(decodedStrings[index]);
                        }
                        return m;
                    });
                    if (count > 0) this.log(`ถอดรหัสตาราง XOR Engine (BolongBot) สำเร็จ ${count} รายการ`);
                }

                return code;
            }

            // Clean Environment & Object Access: getfenv()["game"] -> game, obj["Method"](obj) -> obj:Method()
            cleanSyntaxAndMethods(code) {
                let count = 0;

                // getfenv()["game"] -> game
                code = code.replace(/getfenv\s*\(\s*\)\s*\[\s*"([a-zA-Z_][a-zA-Z0-9_]*)"\s*\]/g, (_, g) => {
                    count++; return g;
                });

                // obj["Method"](obj, ...) -> obj:Method(...)
                code = code.replace(/([a-zA-Z0-9_]+)\["([a-zA-Z_][a-zA-Z0-9_]*)"\]\s*\(\s*\1\s*,?/g, (m, obj, method) => {
                    count++; return `${obj}:${method}(`;
                });

                // obj["Property"] -> obj.Property
                code = code.replace(/\["([a-zA-Z_][a-zA-Z0-9_]*)"\]/g, (m, prop) => {
                    count++; return `.${prop}`;
                });

                if (count > 0) this.log(`ปรับโครงสร้าง Syntax / Method / Property ให้สะอาดขึ้น ${count} จุด`);
                return code;
            }

            // Helper for parsing Lua Byte Arrays
            parseLuaBytes(str) {
                let bytes = [];
                let i = 0;
                while (i < str.length) {
                    if (str[i] === '\\') {
                        i++;
                        if (str[i] === 'x') {
                            bytes.push(parseInt(str.substr(i + 1, 2), 16));
                            i += 3;
                        } else if (/\d/.test(str[i])) {
                            let numMatch = str.substr(i).match(/^\d{1,3}/);
                            if (numMatch) {
                                bytes.push(parseInt(numMatch[0], 10));
                                i += numMatch[0].length;
                            }
                        } else {
                            bytes.push(str.charCodeAt(i));
                            i++;
                        }
                    } else {
                        bytes.push(str.charCodeAt(i));
                        i++;
                    }
                }
                return bytes;
            }

            unescapeLuaString(str) {
                return str.replace(/\\n/g, '\n')
                          .replace(/\\r/g, '\r')
                          .replace(/\\t/g, '\t')
                          .replace(/\\"/g, '"')
                          .replace(/\\\\/g, '\\');
            }

            // Code Beautifier Indentation Engine
            beautifyLua(code) {
                const lines = code.split('\n');
                let indent = 0;
                const formatted = [];
                const inc = /^\s*(function|if|for|while|repeat|do|local\s+function)\b/;
                const dec = /^\s*(end|until|else|elseif)\b/;

                for (let line of lines) {
                    let trimmed = line.trim();
                    if (!trimmed) continue;
                    if (dec.test(trimmed)) indent = Math.max(0, indent - 1);
                    formatted.push("    ".repeat(indent) + trimmed);
                    if (inc.test(trimmed) && !trimmed.endsWith('end')) indent++;
                }
                return formatted.join('\n');
            }
        }

        // =========================================================================
        // UI HANDLERS
        // =========================================================================
        function runDeobfuscator() {
            const input = document.getElementById('input-code').value;
            if (!input.trim()) {
                showToast('กรุณากรอกหรือวางโค้ดก่อนทำการถอดรหัส', 'error');
                return;
            }

            const options = {
                recursive: document.getElementById('opt-recursive').checked,
                tables: document.getElementById('opt-tables').checked,
                escapes: document.getElementById('opt-escapes').checked,
                clean: document.getElementById('opt-clean').checked
            };

            try {
                const engine = new LuaDeobfuscatorEngine(options);
                const { code, logs } = engine.process(input);

                document.getElementById('output-code').value = code;
                renderLogs(logs);

                showToast('ถอดรหัสและประมวลผลสคริปต์เรียบร้อย!', 'success');
            } catch (err) {
                console.error(err);
                showToast('เกิดข้อผิดพลาดรุนแรงในการถอดรหัส', 'error');
            }
        }

        function renderLogs(logs) {
            const logContainer = document.getElementById('log-output');
            const logCountSpan = document.getElementById('log-count');
            logContainer.innerHTML = logs.map(l => {
                let colorClass = 'text-gray-400';
                if (l.includes('[SUCCESS]')) colorClass = 'text-green-400 font-semibold';
                if (l.includes('[ERROR]')) colorClass = 'text-red-400 font-semibold';
                return `<div class="${colorClass}">${escapeHtml(l)}</div>`;
            }).join('');
            logCountSpan.innerText = `${logs.length} รายการ`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function clearAll() {
            document.getElementById('input-code').value = '';
            document.getElementById('output-code').value = '';
            document.getElementById('input-stats').innerText = '0 ตัวอักษร';
            document.getElementById('log-output').innerHTML = '<span class="text-gray-600">-- รอดำเนินการถอดรหัส...</span>';
            document.getElementById('log-count').innerText = '0 รายการ';
            showToast('ล้างข้อมูลเรียบร้อยแล้ว', 'success');
        }

        function copyOutput() {
            const output = document.getElementById('output-code').value;
            if (!output.trim()) return showToast('ไม่มีโค้ดให้คัดลอก', 'error');
            navigator.clipboard.writeText(output).then(() => showToast('คัดลอกโค้ดลง Clipboard สำเร็จ', 'success'));
        }

        function downloadOutput() {
            const output = document.getElementById('output-code').value;
            if (!output.trim()) return showToast('ไม่มีโค้ดให้ดาวน์โหลด', 'error');
            const blob = new Blob([output], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'deobfuscated_script.lua';
            a.click();
            showToast('เริ่มการดาวน์โหลดไฟล์ .lua', 'success');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-message');
            msg.innerText = message;
            icon.className = type === 'success' ? 'fa-solid fa-circle-check text-green-400' : 'fa-solid fa-circle-exclamation text-red-400';
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2500);
        }
    </script>
</body>
</html>
