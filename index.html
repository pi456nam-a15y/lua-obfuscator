<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua & Luau Advanced Deobfuscator Tool</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #0d0f12;
            color: #e2e8f0;
        }
        code, textarea, pre {
            font-family: 'Fira Code', monospace;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #181b20;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #4a5568;
        }
        .glow-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

    <!-- Header Navigation -->
    <header class="border-b border-gray-800 bg-[#12151a] px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-red-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-red-600/30">
                🔓
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-white">Lua Script Deobfuscator Pro</h1>
                <p class="text-xs text-gray-400">เครื่องมือถอดรหัสสคริปต์ขั้นสูง (BolongBot, Hex, String.char, String Tables)</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="clearAll()" class="text-xs bg-gray-800 hover:bg-red-950 hover:text-red-300 text-gray-300 font-medium px-3 py-1.5 rounded-md border border-gray-700 transition">
                <i class="fa-solid fa-trash-can mr-1.5"></i> ล้างข้อมูล
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col space-y-5">

        <!-- 1. ช่องวางโค้ดที่เข้ารหัส -->
        <section class="flex flex-col flex-1 bg-[#12151a] border border-gray-800 rounded-xl p-4 shadow-lg">
            <div class="flex justify-between items-center mb-2">
                <label for="input-code" class="text-sm font-semibold text-gray-300 flex items-center">
                    <i class="fa-solid fa-file-code text-red-500 mr-2"></i> โค้ดที่เข้ารหัสไว้ (Obfuscated Code)
                </label>
                <span id="input-stats" class="text-xs text-gray-500">0 ตัวอักษร</span>
            </div>
            <textarea id="input-code" placeholder="-- วางโค้ด Lua / Luau ที่เข้ารหัสแล้วตรงนี้..." 
                class="w-full h-64 bg-[#090b0e] border border-gray-800 rounded-lg p-3 text-sm text-green-400 focus:outline-none focus:border-red-500 custom-scrollbar resize-y transition"></textarea>
        </section>

        <!-- 2. ปุ่มควบคุมและตัวเลือก -->
        <section class="bg-[#12151a] border border-gray-800 rounded-xl p-4 shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs text-gray-300 w-full md:w-auto">
                <label class="flex items-center space-x-2 cursor-pointer hover:text-white">
                    <input type="checkbox" id="opt-bolong" checked class="rounded border-gray-700 bg-gray-900 text-red-600 focus:ring-red-500">
                    <span class="font-bold text-red-400">BolongBot / Table XOR Engine</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer hover:text-white">
                    <input type="checkbox" id="opt-escapes" checked class="rounded border-gray-700 bg-gray-900 text-red-600 focus:ring-red-500">
                    <span>Decode Hex/Byte Escapes</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer hover:text-white">
                    <input type="checkbox" id="opt-methods" checked class="rounded border-gray-700 bg-gray-900 text-red-600 focus:ring-red-500">
                    <span>Clean Clean Methods & Props</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer hover:text-white">
                    <input type="checkbox" id="opt-beautify" checked class="rounded border-gray-700 bg-gray-900 text-red-600 focus:ring-red-500">
                    <span>Auto Formatter</span>
                </label>
            </div>

            <div class="w-full md:w-auto flex items-center justify-end space-x-3">
                <button onclick="runDeobfuscator()" 
                    class="w-full md:w-auto px-8 py-3 bg-red-600 hover:bg-red-500 text-white font-bold text-base rounded-lg shadow-lg glow-red transition transform active:scale-95 flex items-center justify-center">
                    <i class="fa-solid fa-bolt mr-2"></i> ถอดรหัสโค้ดขั้นสูง
                </button>
            </div>
        </section>

        <!-- 3. ช่องแสดงผลลัพธ์ -->
        <section class="flex flex-col flex-1 bg-[#12151a] border border-gray-800 rounded-xl p-4 shadow-lg">
            <div class="flex justify-between items-center mb-2">
                <label for="output-code" class="text-sm font-semibold text-gray-300 flex items-center">
                    <i class="fa-solid fa-code text-green-500 mr-2"></i> ผลลัพธ์โค้ดที่ถอดรหัสแล้ว (Deobfuscated Output)
                </label>
                <div class="flex items-center space-x-2">
                    <button onclick="copyOutput()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-md border border-gray-700 transition">
                        <i class="fa-regular fa-copy mr-1"></i> คัดลอก
                    </button>
                    <button onclick="downloadOutput()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-md border border-gray-700 transition">
                        <i class="fa-solid fa-download mr-1"></i> ดาวน์โหลด .lua
                    </button>
                </div>
            </div>
            <textarea id="output-code" readonly placeholder="-- ผลลัพธ์จะแสดงขึ้นที่นี่หลังกดถอดรหัส..." 
                class="w-full h-80 bg-[#090b0e] border border-gray-800 rounded-lg p-3 text-sm text-blue-300 focus:outline-none custom-scrollbar resize-y"></textarea>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 border border-gray-700 text-white px-4 py-2.5 rounded-lg shadow-2xl text-xs flex items-center space-x-2 transition opacity-0 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toast-message">แจ้งเตือน</span>
    </div>

    <script>
        document.getElementById('input-code').addEventListener('input', function() {
            document.getElementById('input-stats').innerText = `${this.value.length.toLocaleString()} ตัวอักษร`;
        });

        function parseLuaBytes(str) {
            let bytes = [];
            let i = 0;
            while (i < str.length) {
                if (str[i] === '\\') {
                    i++;
                    if (str[i] === 'x') {
                        bytes.push(parseInt(str.substr(i + 1, 2), 16));
                        i += 3;
                    } else if (/\d/.test(str[i])) {
                        let numMatch = str.substr(i).match(/^\d{1,3}/);
                        if (numMatch) {
                            bytes.push(parseInt(numMatch[0], 10));
                            i += numMatch[0].length;
                        }
                    } else {
                        bytes.push(str.charCodeAt(i));
                        i++;
                    }
                } else {
                    bytes.push(str.charCodeAt(i));
                    i++;
                }
            }
            return bytes;
        }

        function deobfuscateBolongBotEngine(code) {
            // ค้นหาตารางสตริงหลากรูปแบบ เช่น local _pIzl = { "...", "..." }
            const tableMatch = code.match(/local\s+([a-zA-Z0-9_]+)\s*=\s*\{\s*("(?:[^"\\]|\\.)*"(?:\s*,\s*"(?:[^"\\]|\\.)*")*)\s*\}/s);
            const varMapMatch = code.match(/local\s+([a-zA-Z0-9_]+)\s*=\s*\{\s*\}/);

            if (!tableMatch) return code;

            const arrayVarName = tableMatch[1];
            const rawElements = tableMatch[2];
            
            // ค้นหาชื่อตารางผลลัพธ์ที่ใช้งานหลัก (เช่น vQ_1NqMvoz_)
            const resultTableMatch = code.match(/([a-zA-Z0-9_]+)\s*\[\s*lUbqI_Q1\s*\]\s*=\s*table\.concat/);
            const targetTableName = resultTableMatch ? resultTableMatch[1] : null;

            // พาร์สค่าคีย์ XOR ชนิดไดนามิก
            let initKey = 97, stepKey = 8;
            const initMatch = code.match(/local\s+[a-zA-Z0-9_]+\s*=\s*(\d+)/);
            if (initMatch) initKey = parseInt(initMatch[1], 10);

            // แยกเอลิเมนต์ของสตริง
            const stringRegex = /"((?:[^"\\]|\\.)*)"/g;
            let match;
            let strings = [];
            while ((match = stringRegex.exec(rawElements)) !== null) {
                strings.push(match[1]);
            }

            // ถอดรหัสแต่ละสตริงผ่าน XOR Loop
            let decodedStrings = {};
            for (let idx = 0; idx < strings.length; idx++) {
                let luaIdx = idx + 1;
                let xorKey = (initKey + luaIdx * stepKey) % 256;
                let rawBytes = parseLuaBytes(strings[idx]);
                let decrypted = rawBytes.map(b => String.fromCharCode(b ^ xorKey)).join('');
                decodedStrings[luaIdx] = decrypted;
            }

            // แทนที่การอ้างอิงตารางผลลัพธ์ เช่น vQ_1NqMvoz_[284] -> "pcall"
            if (targetTableName) {
                const replaceRegex = new RegExp(targetTableName + '\\s*\\[\\s*(\\d+)\\s*\\]', 'g');
                code = code.replace(replaceRegex, (m, indexStr) => {
                    let index = parseInt(indexStr, 10);
                    if (decodedStrings[index] !== undefined) {
                        return JSON.stringify(decodedStrings[index]);
                    }
                    return m;
                });
            }

            return code;
        }

        function runDeobfuscator() {
            const input = document.getElementById('input-code').value;
            if (!input.trim()) {
                showToast('กรุณากรอกหรือวางโค้ดก่อนทำการถอดรหัส', 'error');
                return;
            }

            const options = {
                bolong: document.getElementById('opt-bolong').checked,
                escapes: document.getElementById('opt-escapes').checked,
                methods: document.getElementById('opt-methods').checked,
                beautify: document.getElementById('opt-beautify').checked
            };

            let code = input;

            try {
                // Step 1: ถอดรหัสสคริปต์รูปแบบ BolongBot / String Table
                if (options.bolong) {
                    code = deobfuscateBolongBotEngine(code);
                }

                // Step 2: Decode Byte & Hex Escapes (\104\101 หรือ \x48)
                if (options.escapes) {
                    code = code.replace(/\\x([0-9a-fA-F]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
                    code = code.replace(/\\([0-9]{1,3})/g, (m, dec) => {
                        const num = parseInt(dec, 10);
                        if (num >= 32 && num <= 126) {
                            const char = String.fromCharCode(num);
                            return (char === '"' || char === '\\') ? `\\${char}` : char;
                        }
                        return m;
                    });
                    code = code.replace(/string\.char\s*\(\s*([\d\s,]+)\s*\)/gi, (m, bytes) => {
                        try {
                            const arr = bytes.split(',').map(b => parseInt(b.trim(), 10));
                            return JSON.stringify(String.fromCharCode(...arr));
                        } catch(e) { return m; }
                    });
                }

                // Step 3: ปรับแต่งรูปแบบการเรียกใช้ เมธอด และ พร็อพเพอร์ตี้
                if (options.methods) {
                    // แปลง obj["Method"](obj, arg) เป็น obj:Method(arg)
                    code = code.replace(/([a-zA-Z0-9_]+)\["([a-zA-Z0-9_]+)"\]\s*\(\s*\1\s*,?/g, '$1:$2(');
                    // แปลง obj["Property"] เป็น obj.Property
                    code = code.replace(/\["([a-zA-Z_][a-zA-Z0-9_]*)"\]/g, '.$1');
                    code = code.replace(/\['([a-zA-Z_][a-zA-Z0-9_]*)'\]/g, '.$1');
                }

                // Step 4: Formatting
                if (options.beautify) {
                    code = beautifyLua(code);
                }

                document.getElementById('output-code').value = code;
                showToast('ถอดรหัสและเรียบเรียงโครงสร้างสคริปต์สำเร็จ!', 'success');

            } catch (err) {
                console.error(err);
                showToast('เกิดข้อผิดพลาดในการถอดรหัส', 'error');
            }
        }

        function beautifyLua(code) {
            const lines = code.split('\n');
            let indent = 0;
            const formatted = [];
            const inc = /^\s*(function|if|for|while|repeat|do|local\s+function)\b/;
            const dec = /^\s*(end|until|else|elseif)\b/;

            for (let line of lines) {
                let trimmed = line.trim();
                if (!trimmed) continue;
                if (dec.test(trimmed)) indent = Math.max(0, indent - 1);
                formatted.push("    ".repeat(indent) + trimmed);
                if (inc.test(trimmed) && !trimmed.endsWith('end')) indent++;
            }
            return formatted.join('\n');
        }

        function clearAll() {
            document.getElementById('input-code').value = '';
            document.getElementById('output-code').value = '';
            document.getElementById('input-stats').innerText = '0 ตัวอักษร';
            showToast('ล้างข้อมูลเรียบร้อยแล้ว', 'success');
        }

        function copyOutput() {
            const output = document.getElementById('output-code').value;
            if (!output.trim()) return showToast('ไม่มีโค้ดให้คัดลอก', 'error');
            navigator.clipboard.writeText(output).then(() => showToast('คัดลอกโค้ดสำเร็จ', 'success'));
        }

        function downloadOutput() {
            const output = document.getElementById('output-code').value;
            if (!output.trim()) return showToast('ไม่มีโค้ดให้ดาวน์โหลด', 'error');
            const blob = new Blob([output], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'deobfuscated_script.lua';
            a.click();
            showToast('เริ่มการดาวน์โหลดไฟล์ .lua', 'success');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-message');
            msg.innerText = message;
            icon.className = type === 'success' ? 'fa-solid fa-circle-check text-green-400' : 'fa-solid fa-circle-exclamation text-red-400';
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2500);
        }
    </script>
</body>
</html>
